name: Package unsigned Mac release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and package unsigned apps
        run: bash scripts/package-unsigned-release.sh

      - name: Upload downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-mac-apps
          path: dist/unsigned-release/*
          if-no-files-found: error

      - name: Attach packages to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/unsigned-release/*.dmg \
            dist/unsigned-release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
