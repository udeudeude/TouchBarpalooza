name: Build Mac apps

on:
  push:
    branches: [main]
  pull_request:

jobs:
  touchbarpalooza:
    runs-on: macos-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    name: ${{ matrix.configuration }} build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build TouchBarpalooza
        run: |
          xcodebuild \
            -project TouchBarpalooza.xcodeproj \
            -target TouchBarpalooza \
            -configuration "${{ matrix.configuration }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

  poki-sitelen:
    runs-on: macos-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    name: poki sitelen ${{ matrix.configuration }} build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build poki sitelen
        run: |
          xcodebuild \
            -project PokiSitelen.xcodeproj \
            -target PokiSitelen \
            -configuration "${{ matrix.configuration }}" \
            CODE_SIGNING_ALLOWED=NO \
            build
