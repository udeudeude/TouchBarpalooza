name: Build Mac apps

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - app: TouchBarpalooza
            project: TouchBarpalooza.xcodeproj
            target: TouchBarpalooza
            configuration: Debug
          - app: TouchBarpalooza
            project: TouchBarpalooza.xcodeproj
            target: TouchBarpalooza
            configuration: Release
          - app: poki sitelen
            project: PokiSitelen.xcodeproj
            target: PokiSitelen
            configuration: Debug
          - app: poki sitelen
            project: PokiSitelen.xcodeproj
            target: PokiSitelen
            configuration: Release
    name: ${{ matrix.app }} ${{ matrix.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project "${{ matrix.project }}" \
            -target "${{ matrix.target }}" \
            -configuration "${{ matrix.configuration }}" \
            CODE_SIGNING_ALLOWED=NO \
            build
